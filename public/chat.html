<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trò Chuyện AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            display: flex;
            font-family: Arial, Helvetica, sans-serif;
            color: #1f2937;
            background: #f3f4f6;
            font-size: 16px;
        }

        /* ---------------- Sidebar ---------------- */
        .sidebar {
            width: 280px;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            border-right: 1px solid #e5e7eb;
            height: 100vh;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 20px 16px;
            font-size: 18px;
            font-weight: bold;
            color: #111827;
        }

        .logo-badge {
            width: 36px;
            height: 36px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            background: linear-gradient(135deg, #0ea47f, #0e7490);
            color: white;
            font-size: 18px;
        }

        .new-chat-btn {
            margin: 6px 16px 14px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            color: #111827;
            background: #f3f4f6;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .new-chat-btn:hover {
            background: #e5e7eb;
        }

        .history {
            flex: 1;
            overflow-y: auto;
            padding: 0 8px;
        }

        .history-title {
            padding: 8px 10px;
            font-size: 12px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: #6b7280;
        }

        .history-empty {
            padding: 10px;
            font-size: 14px;
            color: #9aa0a6;
        }

        .history-item {
            display: flex;
            align-items: center;
            gap: 8px;
            width: 100%;
            padding: 11px 10px;
            margin-bottom: 2px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: #374151;
            font-size: 15px;
            text-align: left;
            cursor: pointer;
        }

        .history-item:hover {
            background: #eef0f4;
        }

        .history-item.active {
            background: #dcf3ed;
            color: #0c6b54;
        }

        .history-item .title {
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .history-item .del {
            background: none;
            border: none;
            color: #9aa0a6;
            font-size: 14px;
            cursor: pointer;
            display: none;
            padding: 2px 4px;
        }

        .history-item:hover .del {
            display: inline-block;
        }

        .history-item .del:hover {
            color: #dc2626;
        }

        .profile {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px;
            border-top: 1px solid #e5e7eb;
        }

        .global-btn {
            margin: 4px 8px 10px;
            padding: 11px 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            color: #374151;
            background: #f3f4f6;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }

        .global-btn:hover {
            background: #e5e7eb;
            color: #111827;
        }

        .profile .avatar {
            width: 34px;
            height: 34px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #e5e7eb;
            color: #374151;
            font-size: 15px;
            font-weight: bold;
        }

        .profile .name {
            flex: 1;
            font-size: 15px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #111827;
        }

        .profile .icon {
            background: none;
            border: none;
            color: #6b7280;
            font-size: 17px;
            cursor: pointer;
            padding: 4px;
        }

        .profile .icon:hover {
            color: #111827;
        }

        /* ---------------- Chat area ---------------- */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            height: 100vh;
            background: #f8fafc;
        }

        #chatWindow {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-empty {
            margin: auto;
            max-width: 540px;
            text-align: center;
            color: #6b7280;
        }

        .chat-empty h1 {
            font-size: 28px;
            color: #111827;
        }

        .chat-empty p {
            font-size: 17px;
        }

        .msg {
            max-width: 760px;
            width: fit-content;
            padding: 14px 18px;
            border-radius: 14px;
            line-height: 1.7;
            font-size: 17px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
        }

        .msg.user {
            align-self: flex-end;
            color: white;
            background: #0ea47f;
            border-bottom-right-radius: 5px;
        }

        .msg.ai {
            align-self: flex-start;
            color: #1f2937;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            border-bottom-left-radius: 5px;
        }

        .msg.ai.typing {
            color: #9aa0a6;
            font-style: italic;
        }

        .log-header {
            align-self: center;
            text-align: center;
            margin-bottom: 6px;
            color: #111827;
            font-size: 19px;
            font-weight: bold;
        }

        .log-sub {
            align-self: center;
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .log-card {
            width: 100%;
            max-width: 760px;
            align-self: center;
            padding: 15px 18px;
            border-radius: 12px;
            color: #1f2937;
            background: #ffffff;
            border: 1px solid #e5e7eb;
            font-size: 15px;
        }

        .log-card .row {
            margin-bottom: 7px;
            line-height: 1.6;
            overflow-wrap: anywhere;
        }

        .log-card .row:last-child {
            margin-bottom: 0;
        }

        .log-card .name {
            display: inline-block;
            padding: 3px 9px;
            border-radius: 7px;
            color: white;
            background: #0ea47f;
            font-size: 13px;
            font-weight: bold;
        }

        .log-card .time {
            float: right;
            color: #6b7280;
            font-size: 13px;
        }

        .log-card .label {
            color: #6b7280;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .input-bar {
            display: flex;
            gap: 10px;
            padding: 16px 24px 22px;
            max-width: 840px;
            width: 100%;
            margin: 0 auto;
        }

        .input-bar input {
            flex: 1;
            padding: 15px 18px;
            border: 2px solid #d1d5db;
            border-radius: 12px;
            color: #111827;
            background: #ffffff;
            font-size: 18px;
            outline: none;
        }

        .input-bar input::placeholder {
            color: #9aa0a6;
        }

        .input-bar input:focus {
            border-color: #0ea47f;
            box-shadow: 0 0 0 3px rgba(14, 164, 127, 0.18);
        }

        .input-bar button {
            padding: 15px 24px;
            border: none;
            border-radius: 12px;
            color: white;
            background: #0ea47f;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .input-bar button:hover {
            background: #0c8d6c;
        }

        .input-bar button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* ---------------- Verdict cards ---------------- */
        .msg.verdict {
            width: 100%;
            max-width: 760px;
            align-self: flex-start;
            padding: 14px 16px 16px;
            border-left: 6px solid #9ca3af;
        }

        .msg.verdict.warning {
            border-left-color: #dc2626;
            background: #fef2f2;
        }

        .msg.verdict.needs_more_info {
            border-left-color: #f59e0b;
            background: #fffbeb;
        }

        .msg.verdict.safe {
            border-left-color: #10b981;
            background: #ecfdf5;
        }

        .vc-banner {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .vc-badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 15px;
        }

        .verdict.warning .vc-badge {
            background: #dc2626;
            color: #fff;
        }

        .verdict.needs_more_info .vc-badge {
            background: #f59e0b;
            color: #fff;
        }

        .verdict.safe .vc-badge {
            background: #10b981;
            color: #fff;
        }

        .vc-confidence {
            font-size: 13px;
            color: #6b7280;
            font-weight: bold;
        }

        .vc-section {
            margin-top: 12px;
            font-size: 13px;
            font-weight: bold;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.4px;
        }

        .vc-explanation {
            margin: 4px 0 0;
            line-height: 1.7;
            font-size: 16px;
        }

        .vc-evidence {
            margin: 4px 0 0;
            padding-left: 20px;
            line-height: 1.6;
        }

        .vc-action {
            margin-top: 12px;
            padding: 12px 14px;
            border-radius: 10px;
            background: #fff;
            border: 1px solid #e5e7eb;
            font-weight: bold;
            font-size: 16px;
            line-height: 1.6;
        }

        .verdict.warning .vc-action {
            color: #7f1d1d;
            border-color: #fecaca;
            background: #fee2e2;
        }

        .vc-sources {
            margin: 6px 0 0;
            padding-left: 20px;
        }

        .vc-sources a {
            color: #0e7490;
            overflow-wrap: anywhere;
        }

        @media (max-width: 700px) {
            body {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                height: auto;
                max-height: 40vh;
                border-right: none;
                border-bottom: 1px solid #e5e7eb;
            }

            .chat-area {
                height: 60vh;
            }
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="logo">
            <div class="logo-badge">✦</div>
            Trợ lý Phát Hiện lừa Đảo
        </div>

        <button class="new-chat-btn" id="newChatBtn">
            ✚ Trò chuyện mới
        </button>

        <div class="history">
            <div class="history-title">Lịch sử trò chuyện</div>
            <div class="history-empty" id="historyEmpty">
                Chưa có cuộc trò chuyện nào.
            </div>
            <ul id="historyList" style="list-style:none;margin:0;padding:0;"></ul>
        </div>

        <button class="global-btn" id="globalBtn">🌐 Dữ liệu toàn bộ</button>

        <div class="profile">
            <div class="avatar">U</div>
            <div class="name" id="profileName">Hồ sơ</div>
            <button class="icon" id="settingsBtn" title="Cài đặt" aria-label="Cài đặt">⚙</button>
        </div>
    </aside>

    <main class="chat-area">
        <div id="chatWindow">
            <div class="chat-empty" id="emptyState">
                <h1>Bạn cần giúp gì ạ?</h1>
                <p>Gõ tin nhắn bên dưới để bắt đầu trò chuyện.</p>
            </div>
        </div>

        <form class="input-bar" id="chatForm">
            <input
                id="txtMessage"
                type="text"
                placeholder="Nhập tin nhắn của bạn..."
                autocomplete="off"
                required
            >
            <button id="sendButton" type="submit">Gửi</button>
        </form>
    </main>

    <script>
        // ---------------- State ----------------
        const STORAGE_KEY = "duyanhtod_ai_conversations";

        // Load conversations from localStorage, or start fresh.
        let conversations = loadConversations();
        let currentId = conversations[0] ? conversations[0].id : null;
        let busy = false;

        const chatWindow = document.getElementById("chatWindow");
        const emptyState = document.getElementById("emptyState");
        const chatForm = document.getElementById("chatForm");
        const messageInput = document.getElementById("txtMessage");
        const sendButton = document.getElementById("sendButton");
        const newChatBtn = document.getElementById("newChatBtn");
        const historyList = document.getElementById("historyList");
        const historyEmpty = document.getElementById("historyEmpty");

        function loadConversations() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                const parsed = raw ? JSON.parse(raw) : [];
                return Array.isArray(parsed) ? parsed : [];
            } catch {
                return [];
            }
        }

        function saveConversations() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(conversations));
        }

        function newId() {
            return Date.now() + "-" + Math.random().toString(36).slice(2, 8);
        }

        function getCurrent() {
            return conversations.find(function (c) {
                return c.id === currentId;
            }) || null;
        }

        // ---------------- Rendering ----------------
        function appendMessage(text, role) {
            emptyState.style.display = "none";

            const bubble = document.createElement("div");
            bubble.className = "msg " + role;
            bubble.textContent = text;
            chatWindow.appendChild(bubble);
            chatWindow.scrollTop = chatWindow.scrollHeight;

            return bubble;
        }

        // Verdict display metadata (Vietnamese).
        const VERDICT_META = {
            warning: { icon: "🚨", label: "Cảnh báo lừa đảo" },
            needs_more_info: { icon: "❓", label: "Cần thêm thông tin" },
            safe: { icon: "✅", label: "An toàn" }
        };

        function verdictType(v) {
            const t = (v && v.verdict) || "";
            return (t in VERDICT_META) ? t : "needs_more_info";
        }

        function buildVerdictCard(bubble, v) {
            bubble.innerHTML = "";

            const t = verdictType(v);
            const meta = VERDICT_META[t];

            bubble.classList.add("verdict", t);

            const conf =
                typeof v.confidence === "number"
                    ? Math.round(v.confidence * 100)
                    : null;

            // Header: badge + confidence.
            const banner = document.createElement("div");
            banner.className = "vc-banner";

            const badge = document.createElement("span");
            badge.className = "vc-badge";
            badge.textContent = meta.icon + " " + meta.label;
            banner.appendChild(badge);

            if (conf !== null) {
                const c = document.createElement("span");
                c.className = "vc-confidence";
                c.textContent = "Độ tin cậy: " + conf + "%";
                banner.appendChild(c);
            }
            bubble.appendChild(banner);

            // Explanation.
            if (v.explanation) {
                const ex = document.createElement("div");
                ex.className = "vc-explanation";
                ex.textContent = v.explanation;
                bubble.appendChild(ex);
            }

            // Evidence list.
            if (Array.isArray(v.evidence) && v.evidence.length) {
                const lab = document.createElement("div");
                lab.className = "vc-section";
                lab.textContent = "Dấu hiệu phát hiện";
                bubble.appendChild(lab);

                const ul = document.createElement("ul");
                ul.className = "vc-evidence";
                v.evidence.forEach(function (e) {
                    const li = document.createElement("li");
                    li.textContent = e;
                    ul.appendChild(li);
                });
                bubble.appendChild(ul);
            }

            // Suggested action.
            if (v.suggested_action) {
                const act = document.createElement("div");
                act.className = "vc-action";
                act.textContent = "👉 " + v.suggested_action;
                bubble.appendChild(act);
            }

            // Sources.
            if (Array.isArray(v.sources) && v.sources.length) {
                const lab = document.createElement("div");
                lab.className = "vc-section";
                lab.textContent = "Nguồn tham khảo";
                bubble.appendChild(lab);

                const ul = document.createElement("ul");
                ul.className = "vc-sources";
                v.sources.forEach(function (s) {
                    const li = document.createElement("li");
                    const a = document.createElement("a");
                    a.textContent = s.title || s.url || s;
                    a.href = s.url || "#";
                    a.target = "_blank";
                    a.rel = "noopener";
                    li.appendChild(a);
                    ul.appendChild(li);
                });
                bubble.appendChild(ul);
            }
        }

        // Fill an AI bubble: verdict card when available, else plain text.
        function fillAiMessage(bubble, m) {
            if (m && m.verdict && m.verdict.verdict) {
                buildVerdictCard(bubble, m.verdict);
                return;
            }
            bubble.textContent = m.text || "";
        }

        function renderConversation() {
            chatWindow.innerHTML = "";

            const current = getCurrent();

            if (!current || current.messages.length === 0) {
                emptyState.style.display = "";
                chatWindow.appendChild(emptyState);
            } else {
                emptyState.style.display = "none";
                current.messages.forEach(function (m) {
                    const bubble = document.createElement("div");

                    if (m.role === "user") {
                        bubble.className = "msg user";
                        bubble.textContent = m.text || "";
                    } else {
                        bubble.className = "msg ai";
                        fillAiMessage(bubble, m);
                    }

                    chatWindow.appendChild(bubble);
                });
                chatWindow.scrollTop = chatWindow.scrollHeight;
            }
        }

        function renderHistory() {
            historyList.innerHTML = "";

            const sorted = conversations.slice().reverse();

            historyEmpty.style.display =
                sorted.length ? "none" : "";

            sorted.forEach(function (conv) {
                const li = document.createElement("li");

                const btn = document.createElement("button");
                btn.className = "history-item";
                if (conv.id === currentId) {
                    btn.classList.add("active");
                }

                const title = document.createElement("span");
                title.className = "title";
                title.textContent = conv.title || "Cuộc trò chuyện mới";

                const del = document.createElement("button");
                del.className = "del";
                del.textContent = "✕";
                del.title = "Xóa cuộc trò chuyện";

                del.addEventListener("click", function (e) {
                    e.stopPropagation();
                    deleteConversation(conv.id);
                });

                btn.addEventListener("click", function () {
                    openConversation(conv.id);
                });

                btn.appendChild(title);
                btn.appendChild(del);
                li.appendChild(btn);
                historyList.appendChild(li);
            });
        }

        // ---------------- Actions ----------------
        const USER_NAME_KEY = "duyanhtod_ai_user_name";

        function getUserName() {
            return localStorage.getItem(USER_NAME_KEY) || "Khách";
        }

        function saveUserName(name) {
            localStorage.setItem(USER_NAME_KEY, name);
            document.getElementById("profileName").textContent = name;
        }

        // Names containing "admin" (case-insensitive) open the admin page.
        function isAdminName(n) {
            return (n || "").toLowerCase().indexOf("admin") !== -1;
        }

        function promptForName() {
            const existing = getUserName();
            const name = window.prompt(
                "Bạn tên gì? (tên sẽ hiển thị trong hồ sơ trò chuyện)",
                existing
            );

            if (name && name.trim()) {
                const clean = name.trim().slice(0, 100);
                saveUserName(clean);

                // If this is an admin name, go to the admin page.
                if (isAdminName(clean)) {
                    window.location.href = "admin.html";
                }
            }
        }

        function newChat() {
            const conv = {
                id: newId(),
                title: "Cuộc trò chuyện mới",
                messages: []
            };
            conversations.push(conv);
            currentId = conv.id;
            saveConversations();
            renderConversation();
            renderHistory();
            messageInput.focus();
        }

        function openConversation(id) {
            currentId = id;
            saveConversations();
            renderConversation();
            renderHistory();
        }

        function deleteConversation(id) {
            conversations = conversations.filter(function (c) {
                return c.id !== id;
            });

            if (currentId === id) {
                currentId = conversations.length
                    ? conversations[0].id
                    : null;
            }

            saveConversations();
            renderConversation();
            renderHistory();
        }

        // ---------------- Chat submit ----------------
        chatForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            const message = messageInput.value.trim();

            if (!message || busy) {
                return;
            }

            let current = getCurrent();

            if (!current) {
                newChat();
                current = getCurrent();
            }

            // Use the first user message as the conversation title.
            if (current.messages.length === 0) {
                current.title = message.slice(0, 40);
            }

            current.messages.push({ role: "user", text: message });

            messageInput.value = "";
            renderConversation();

            const typingBubble = appendMessage("Đang suy nghĩ...", "ai typing");

            busy = true;
            sendButton.disabled = true;
            sendButton.textContent = "Đang gửi...";

            try {
                const response = await fetch("/ai", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        name: getUserName(),
                        message
                    })
                });

                const json = await response.json();
                typingBubble.classList.remove("typing");

                if (!response.ok || !json.success) {
                    typingBubble.textContent =
                        json.message || "Lỗi xử lý yêu cầu.";
                    typingBubble.classList.add("msg", "ai");
                    return;
                }

                if (json.verdict && json.verdict.verdict) {
                    const aiMsg = {
                        role: "ai",
                        text: json.reply || "",
                        verdict: json.verdict
                    };
                    fillAiMessage(typingBubble, aiMsg);
                    current.messages.push(aiMsg);
                } else {
                    const reply = json.reply || "(không có phản hồi)";
                    typingBubble.textContent = reply;
                    current.messages.push({ role: "ai", text: reply });
                }
            } catch (error) {
                typingBubble.classList.remove("typing");
                typingBubble.textContent =
                    "Đã xảy ra lỗi: " + error.message;
            } finally {
                busy = false;
                sendButton.disabled = false;
                sendButton.textContent = "Gửi";
                saveConversations();
                renderHistory();
                messageInput.focus();
            }
        });

        newChatBtn.addEventListener("click", newChat);
        document.getElementById("settingsBtn").addEventListener("click", promptForName);

        // ---------------- Global log view ----------------
        async function showGlobalLog() {
            chatWindow.innerHTML = "";
            emptyState.style.display = "none";

            const header = document.createElement("div");
            header.className = "log-header";
            header.textContent = "🌐 Dữ liệu toàn bộ";
            chatWindow.appendChild(header);

            const loading = document.createElement("div");
            loading.className = "msg ai typing";
            loading.textContent = "Đang tải...";
            chatWindow.appendChild(loading);

            try {
                const response = await fetch("/chat-logs");
                const json = await response.json();

                if (!response.ok || !json.success) {
                    throw new Error(json.message || "Không tải được dữ liệu.");
                }

                chatWindow.removeChild(loading);

                const logs = json.logs || [];

                const sub = document.createElement("div");
                sub.className = "log-sub";
                sub.textContent =
                    logs.length + " bản ghi trong chat-logs.json";
                chatWindow.appendChild(sub);

                if (logs.length === 0) {
                    const none = document.createElement("div");
                    none.className = "msg ai";
                    none.textContent = "Chưa có dữ liệu chat nào.";
                    chatWindow.appendChild(none);
                }

                // Show newest first.
                logs.slice().reverse().forEach(function (log) {
                    const card = document.createElement("div");
                    card.className = "log-card";

                    const nameRow = document.createElement("div");
                    nameRow.className = "row";

                    const name = document.createElement("span");
                    name.className = "name";
                    name.textContent = log.name || "Khách";

                    const time = document.createElement("span");
                    time.className = "time";
                    time.textContent = log.timestamp || "";

                    nameRow.appendChild(name);
                    nameRow.appendChild(time);
                    card.appendChild(nameRow);

                    // Verdict badge (if recorded).
                    if (log.verdict && log.verdict.verdict) {
                        const meta = VERDICT_META[verdictType(log.verdict)];
                        const bgMap = {
                            warning: "#dc2626",
                            needs_more_info: "#f59e0b",
                            safe: "#10b981"
                        };
                        const vbRow = document.createElement("div");
                        vbRow.className = "row";
                        const vb = document.createElement("span");
                        vb.className = "name";
                        vb.style.background =
                            bgMap[verdictType(log.verdict)] || "#6b7280";
                        vb.textContent = meta.icon + " " + meta.label;
                        vbRow.appendChild(vb);
                        card.appendChild(vbRow);
                    }

                    const msgLabel = document.createElement("div");
                    msgLabel.className = "row label";
                    msgLabel.textContent = "Tin nhắn";

                    const msg = document.createElement("div");
                    msg.className = "row";
                    msg.textContent = log.message || "";

                    const replyLabel = document.createElement("div");
                    replyLabel.className = "row label";
                    replyLabel.textContent = "Phản hồi";

                    const reply = document.createElement("div");
                    reply.className = "row";
                    reply.textContent = log.reply || "";

                    card.appendChild(msgLabel);
                    card.appendChild(msg);
                    card.appendChild(replyLabel);
                    card.appendChild(reply);

                    chatWindow.appendChild(card);
                });
            } catch (error) {
                chatWindow.removeChild(loading);
                const err = document.createElement("div");
                err.className = "msg ai";
                err.textContent = "Lỗi: " + error.message;
                chatWindow.appendChild(err);
            }

            chatWindow.scrollTop = chatWindow.scrollHeight;
        }

        document.getElementById("globalBtn").addEventListener("click", showGlobalLog);

        // ---------------- Init ----------------
        // Ask for a name on the first visit (stored for later visits).
        if (!localStorage.getItem(USER_NAME_KEY)) {
            promptForName();
        }
        document.getElementById("profileName").textContent = getUserName();

        // A returning visitor whose saved name is an admin goes to the
        // admin page instead of the chat page.
        if (isAdminName(getUserName())) {
            window.location.href = "admin.html";
        }

        if (!currentId) {
            newChat();
        } else {
            renderConversation();
        }
        renderHistory();
    </script>

</body>
</html>
